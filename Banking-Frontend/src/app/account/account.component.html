<div class="container mx-auto p-4">
  <h2 class="text-xl font-semibold mb-4">Transaction History</h2>
  <div *ngIf="transactions.length > 0; else noTransactions">
    <ul class="space-y-4">
      <li
        *ngFor="let transaction of transactions"
        class="bg-gray-100 p-3 rounded-md shadow-md"
      >
        <div><strong>Amount: </strong>{{ transaction.amount | currency }}</div>
        <div><strong>Type: </strong>{{ transaction.type }}</div>
        <div>
          <strong>Date: </strong
          >{{ transaction.transactionDate | date : "short" }}
        </div>
        <div><strong>Description: </strong>{{ transaction.description }}</div>
      </li>
    </ul>
  </div>
  <ng-template #noTransactions>
    <p>No transactions found for this account.</p>
  </ng-template>

  <button
    type="submit"
    class="ml-[300px] mt-[50px] bg-blue-600 text-white p-3 rounded-lg hover:bg-blue-700 transition font-semibold"
    (click)="navigateTo('/create-account')"
  >
    Create Account
  </button>
</div>
