<div class="bg-gray-100 flex items-center justify-center min-h-screen">
  <form
    (ngSubmit)="handleSubmit()"
    class="bg-white p-6 rounded-lg shadow-lg w-96"
  >
    <h2 class="text-2xl font-bold text-gray-700 text-center mb-4">Sign Up</h2>
    <p *ngIf="message" class="text-green-600 text-center font-semibold">
      {{ message }}
    </p>

    <div class="mb-4">
      <label class="block text-gray-600 text-sm mb-2">Full Name</label>
      <input
        name="name"
        [(ngModel)]="formData.name"
        type="text"
        id="name"
        placeholder="Enter your name"
        class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-400"
      />
    </div>

    <div class="mb-4">
      <label class="block text-gray-600 text-sm mb-2">Email</label>
      <input
        [(ngModel)]="formData.email"
        name="email"
        type="email"
        id="email"
        placeholder="Enter your email"
        class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-400"
      />
    </div>

    <div class="mb-4">
      <label class="block text-gray-600 text-sm mb-2">Phone</label>
      <input
        [(ngModel)]="formData.phoneNumber"
        name="phoneNumber"
        type="text"
        id="name"
        placeholder="+250 787 990 300"
        class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-400"
      />
    </div>

    <div class="mb-4">
      <label class="block text-gray-600 text-sm mb-2">Password</label>
      <input
        [(ngModel)]="formData.password"
        type="password"
        id="password"
        name="password"
        placeholder="Enter your password"
        class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-400"
      />
    </div>

    <button
      type="submit"
      class="w-full bg-blue-600 text-white p-2 rounded-lg hover:bg-blue-700 transition"
    >
      Sign Up
    </button>

    <p class="text-center text-sm text-gray-600 mt-4">
      Already have an account?
      <a href="#" class="text-blue-500 hover:underline">Log in</a>
    </p>
  </form>
</div>
