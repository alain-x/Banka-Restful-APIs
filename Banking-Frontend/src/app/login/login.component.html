<div class="bg-gray-100 flex items-center justify-center min-h-screen">
  <form class="bg-white p-6 rounded-lg shadow-lg w-96">
    <h2 class="text-2xl font-bold text-gray-700 text-center mb-4">Login</h2>

    <div class="mb-4">
      <label class="block text-gray-600 text-sm mb-2" for="email">Email</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-400"
      />
    </div>

    <div class="mb-4">
      <label class="block text-gray-600 text-sm mb-2" for="password"
        >Password</label
      >
      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-400"
      />
    </div>

    <button
      type="submit"
      class="w-full bg-blue-600 text-white p-2 rounded-lg hover:bg-blue-700 transition"
    >
      Login
    </button>
  </form>
</div>
